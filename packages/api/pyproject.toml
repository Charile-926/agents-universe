[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agents-universe-api"
version = "0.1.0"
description = "Agents Universe — FastAPI web service"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "agent-core",
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "python-multipart>=0.0.12",
    # DB
    "sqlalchemy[asyncio]>=2.0.0",
    # 默认存储：PostgreSQL（账号、项目、会话、工具调用记录）
    "asyncpg>=0.29.0",
    # Alembic 走同步驱动（postgresql+asyncpg → postgresql+psycopg2）
    "psycopg2-binary>=2.9.9",
    # 旧部署回退：SQL Server 驱动（DATABASE_URL 指向 mssql 时才需要）
    "aioodbc>=0.5.0",
    "pyodbc>=5.1.0",
    "alembic>=1.13.0",
    # Auth: 账号 + 密码（PBKDF2）与 Redis 会话，仅依赖标准库 + cryptography；
    # 不再引入 OAuth/JWT 库。
    "httpx>=0.27.0",
    # Encryption (AES-256-GCM token vault, HKDF/Fernet for user fields)
    "cryptography>=43.0.0",
    # Config
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    # Redis (L2 session memory)
    "redis>=5.0.0",
    # Utils
    "python-frontmatter>=1.1.0",
    "aiofiles>=24.1.0",
    # Image metadata (dimensions for uploaded attachments)
    "Pillow>=10.4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "pytest-mock>=3.14.0",
    # Async drivers: the offline migration-compile test renders every dialect
    # (env.py builds an async engine at import time, even offline).
    # Sync drivers: conftest runs the real migration chain on the CI PostgreSQL
    # job, and env.py maps each async URL to its sync alembic counterpart.
    "asyncpg>=0.29.0",
    "aiomysql>=0.2.0",
    "psycopg2-binary>=2.9.9",
    "pymysql>=1.1.0",
]
# Async app drivers (runtime); their sync alembic counterparts live in [test].
postgres = [
    "asyncpg>=0.29.0",
]
mysql = [
    "aiomysql>=0.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
