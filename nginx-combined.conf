# Combined image: nginx is the single public entry point (port 8000). It serves
# the built web UI and proxies API traffic to uvicorn on 127.0.0.1:8001 so the
# browser uses a single origin.
server {
    listen 8000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # index.html must never be cached: it references hashed assets, so a
    # stale copy makes browsers load deleted JS/CSS after every deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Hashed build assets (vite emits index-<hash>.js/css): safe to cache
    # forever — a new deploy changes the hash, never the file content.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API (also carries publish SSE streams — they rely on the app's
    # turn_status heartbeat, not request traffic, so the default 60s read
    # timeout would sever them mid-run and abort the agent as a
    # "client disconnect")
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        # Must exceed the app's 10MB upload cap (plus multipart framing) —
        # nginx's 1MB default would 413 every attachment between 1MB and the
        # app limit with a bare HTML body the frontend cannot map to a code.
        client_max_body_size 12m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # 注意：登录相关路由全部在 /api/auth/*（register / login / logout / me），
    # 已随上面的 /api/ 规则代理。不要再单独代理 /auth/ 前缀——它已没有对应的
    # 后端路由，旧书签会落到后端 404，把裸 JSON 错误直接暴露给浏览器。

    location = /health {
        proxy_pass http://127.0.0.1:8001/health;
        proxy_set_header Host $host;
    }

    # WebSocket connections (conversation streaming, script runs)
    location /ws/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
