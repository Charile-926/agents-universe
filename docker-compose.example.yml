# Docker Compose example — copy to docker-compose.yml, fill .env, then:
#   docker compose up --build
#
# By default the api service's nginx serves the Web UI on http://localhost:8000
# (same-origin reverse proxy for /api and /ws). The hot-reload dev frontend
# on :5173 only starts with:  docker compose --profile dev up
#
# This example runs the full stack locally on localhost. For production
# deployment (custom domain, HTTPS), adapt the URLs and add your own
# reverse proxy / tunnel — see the api service env vars below.
services:
  api:
    build:
      context: .
      target: final
    ports:
      - "8000:8000"
    environment:
      # PostgreSQL 是默认存储（账号、项目、会话、工具调用记录）
      - DATABASE_URL=postgresql+asyncpg://agents:${DB_PASSWORD:-agents}@postgres:5432/agentsuniverse
      - REDIS_URL=redis://redis:6379/0
      # ${VAR:-default} interpolation reads .env — so these stay editable in
      # .env (plain FOO= entries under `environment:` would override env_file)
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:8000}
      - WEB_BASE_URL=${WEB_BASE_URL:-http://localhost:8000}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8000,http://localhost:5173}
      - PROJECTS_ROOT=/app/projects
      - JAVA_HOME=/usr/lib/jvm/msopenjdk-21-amd64
      - HOME=/home/appuser
      - MAVEN_USER_HOME=/home/appuser/.m2
      - GRADLE_USER_HOME=/home/appuser/.gradle
    env_file:
      - .env
    volumes:
      # All persistent data lives under the DOCKER_VOLUME_ROOT host directory.
      # Linux hosts: Docker auto-creates a missing bind-mount source dir as
      # root:root, and the non-root appuser inside the image cannot write it
      # (project creation fails with PROJECT_FS_INIT_FAILED). Pre-create the
      # dir and hand it to the image's runtime uid before `docker compose up`
      # (verify uid/gid with `docker compose exec api id`):
      #   mkdir -p ./data/projects && sudo chown 997:997 ./data/projects
      - ${DOCKER_VOLUME_ROOT:-./data}/projects:/app/projects
      - ${DOCKER_VOLUME_ROOT:-./data}/maven:/home/appuser/.m2
      - ${DOCKER_VOLUME_ROOT:-./data}/gradle:/home/appuser/.gradle
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Dev web server (hot-reload, local dev only — start with: docker compose --profile dev up)
  web:
    build:
      context: .
      target: web-dev
    profiles:
      - dev
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5173 || curl -f http://localhost:5173 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Production-style nginx frontend (use to test the production image locally)
  # Run: docker compose --profile prod-web up --build
  web-prod:
    build:
      context: packages/web
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_PATH=${VITE_API_BASE_PATH:-}
        - VITE_BASE_PATH=${VITE_BASE_PATH:-./}
    ports:
      - "8080:8080"
    profiles:
      - prod-web
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=agentsuniverse
      - POSTGRES_USER=agents
      - POSTGRES_PASSWORD=${DB_PASSWORD:-agents}
    ports:
      - "5432:5432"
    volumes:
      # Named volume: 数据库文件不放进项目目录，避免误删与权限问题。
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agents -d agentsuniverse"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - ${DOCKER_VOLUME_ROOT:-./data}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# Persistent data: 项目工作区等用 DOCKER_VOLUME_ROOT 下的 bind mount；
# PostgreSQL 数据用命名卷，随 `docker compose down -v` 一并清理。
volumes:
  postgres_data:
